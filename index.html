
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <main class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">
            <div class="titulo-relogio">
                <h1><i class="fa-solid fa-list-check"></i> Minhas Tarefas</h1>
                <div id="relogio" class="relogio">00:00:00</div>
            </div>

            <button class="botao-icone" id="botao-alternar-tema"
                aria-label="Alternar tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <section class="painel-xp">
            <div class="info-nivel">
                <span id="texto-nivel">Nível 1</span>
                <span id="texto-xp">0 / 100 XP</span>
            </div>

            <div class="barra-progresso-fundo">
                <div class="barra-progresso-frente" id="barra-xp"></div>
            </div>

            <p class="mensagem-xp">Complete tarefas para ganhar experiência!</p>
        </section>

        <section class="secao-tarefas">
            <h2>Minha lista</h2>

            <div class="caixa-entrada">
                <input type="text" id="campo-tarefa"
                    placeholder="O que vamos fazer hoje?"
                    maxlength="150">

                <button class="botao-principal" id="botao-adicionar">
                    <i class="fa-solid fa-plus"></i>
                    Adicionar
                </button>
            </div>

            <ul class="lista-tarefas" id="lista-tarefas"></ul>

            <footer class="rodape-aplicacao">
                <span id="contador-tarefas">0 tarefas na lista</span>
            </footer>
        </section>

    </main>

    <img src="po.jpg" alt="Minha foto" class="foto-canto-inferior">

    <!-- Personagem e escada pixel art -->
    <div id="cena-jogo" class="cena-jogo">
        <div class="escada-container">
            <div class="degrau" style="bottom:0;right:0;z-index:10"></div>
            <div class="degrau" style="bottom:20px;right:20px;z-index:9"></div>
            <div class="degrau" style="bottom:40px;right:40px;z-index:8"></div>
            <div class="degrau" style="bottom:60px;right:60px;z-index:7"></div>
            <div class="degrau" style="bottom:80px;right:80px;z-index:6"></div>
            <div class="degrau" style="bottom:100px;right:100px;z-index:5"></div>
            <div class="degrau" style="bottom:120px;right:120px;z-index:4"></div>
            <div class="degrau" style="bottom:140px;right:140px;z-index:3"></div>
            <div class="degrau" style="bottom:160px;right:160px;z-index:2"></div>
            <div class="degrau" style="bottom:180px;right:180px;z-index:1"></div>
        </div>

        <div id="personagem-pixel" class="personagem-container">
            <div class="personagem-sprite">
                <div class="pixel-head"></div>
                <div class="pixel-body"></div>
                <div class="pixel-legs">
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
